name: Update tonight's crews

# Daily in-season refresh of data/tonights-crews.json, the live feed behind the
# home page's "Tonight's Officials" module.
#
# WHAT THIS COMMITS -- read before enabling. This is the first automation in the
# repo that writes to it, so the blast radius is deliberately tiny:
#
#   * It commits EXACTLY ONE PATH: data/tonights-crews.json. The commit step
#     stages that file by name (`git add data/tonights-crews.json`) and nothing
#     else, so no other change can ride along.
#   * If the file's content matches what is already committed (ignoring the
#     generated_at timestamp, which changes on every run), it makes NO COMMIT
#     AT ALL and pushes nothing. A dark night in-season, or a re-run of the
#     same day with the same crews, is a clean no-op.
#   * It never replaces a populated file for a date with an EMPTY one for the
#     same date. A later run that fetches games: [] for a date that already has
#     crews committed (a feed blip, or the NBA pulling the page) keeps the
#     committed file.
#   * If the fetch fails, the script writes nothing and exits non-zero. The
#     previously committed file stays as it is; a blip never blanks the module.
#   * Off-season and no-game days write a valid file with games: [], which
#     app.js treats as "keep the server-rendered fallback".
#
# Schedule: three runs daily at 14:30, 16:30 and 18:30 UTC, October through
# June (in-season). The NBA usually posts referee assignments around 9am ET, so
# an earlier run captures an empty or partial list. GitHub cron has no timezone:
# during EDT these are 10:30am / 12:30pm / 2:30pm ET, during EST 9:30am /
# 11:30am / 1:30pm ET. Every run is after the usual posting time in both, and
# the later runs pick up late or corrected assignments. All three resolve to
# the same ET date (well past midnight ET), so they update one day's file.
# July through September the schedule is off; use the manual dispatch below if
# a summer date is ever needed.

on:
  schedule:
    - cron: '30 14,16,18 * 10,11,12,1,2,3,4,5,6 *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Game date YYYY-MM-DD (blank = today, US Eastern)'
        required: false
        default: ''
      commit:
        description: 'Commit the result (uncheck for a dry run that only prints)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # to commit data/tonights-crews.json
  pages: write      # to request a Pages build after the commit

concurrency:
  group: tonights-crews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Keep a copy of the committed file
        # The guard below compares the fresh fetch against this copy.
        run: |
          if [ -f data/tonights-crews.json ]; then
            cp data/tonights-crews.json "$RUNNER_TEMP/tonights-crews.prev.json"
          fi

      - name: Build data/tonights-crews.json
        # The date comes in through the environment, never interpolated into
        # the command line, so a dispatch input cannot become shell syntax.
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python3 scripts/fetch_tonights_crews.py --date "$INPUT_DATE"
          else
            python3 scripts/fetch_tonights_crews.py
          fi

      - name: Keep committed file if the fetch adds nothing
        # Restores the committed file (so the next step sees no change) when:
        #   * the content is identical apart from generated_at, or
        #   * the fetch came back with no games for the SAME date that already
        #     has crews committed -- never blank a populated day with an empty
        #     fetch later that day.
        # A different date, or a new/changed crew list, passes through.
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys
          prev_path = os.path.join(os.environ["RUNNER_TEMP"], "tonights-crews.prev.json")
          new_path = "data/tonights-crews.json"
          if not os.path.exists(prev_path) or not os.path.exists(new_path):
              sys.exit(0)
          try:
              prev = json.load(open(prev_path, encoding="utf-8"))
          except ValueError:
              sys.exit(0)  # unreadable committed file: let the fresh one replace it
          new = json.load(open(new_path, encoding="utf-8"))
          strip = lambda d: {k: v for k, v in d.items() if k != "generated_at"}
          keep, why = False, ""
          if strip(prev) == strip(new):
              keep, why = True, "content unchanged apart from generated_at"
          elif (prev.get("date") == new.get("date")
                and prev.get("games") and not new.get("games")):
              keep, why = True, ("fetch for %s returned no games but %d are already "
                                 "committed" % (new.get("date"), len(prev["games"])))
          if keep:
              shutil.copyfile(prev_path, new_path)
              print("Keeping committed file: " + why)
          else:
              print("Fresh fetch differs from committed file; it will be committed.")
          PY

      - name: Show what changed
        id: diff
        run: |
          # `git status --porcelain`, not `git diff`: on the first ever run the
          # file is UNTRACKED, and git diff reports no change for an untracked
          # path -- which would silently skip the first commit forever.
          if [ -z "$(git status --porcelain -- data/tonights-crews.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to data/tonights-crews.json -- nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Change to be committed:"
            git status --porcelain -- data/tonights-crews.json
            git --no-pager diff -- data/tonights-crews.json | head -80
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.commit)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage this one path only -- never `git add -A`.
          git add data/tonights-crews.json
          GAME_DATE=$(python3 -c 'import json;print(json.load(open("data/tonights-crews.json"))["date"])')
          git commit -m "Update tonight's officiating crews ($GAME_DATE)"
          # Rebase onto whatever landed while the job ran, then push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Request a Pages build
        # Branch-based Pages already rebuilds on push; this is an explicit nudge
        # for it. Best-effort: it fails harmlessly if the site is instead
        # published from a GitHub Actions source, so it never fails the job.
        if: steps.diff.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.commit)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            -w '\nHTTP %{http_code}\n' || true

      - name: Summary
        if: always()
        env:
          COMMITTED: ${{ steps.diff.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.commit) }}
        run: python3 scripts/tonights_crews_summary.py >> "$GITHUB_STEP_SUMMARY"
